version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # New versions wait out the quarantine on Microsoft's CFS package feed.
    cooldown:
      default-days: 14
    groups:
      npm-all:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      npm-site-all:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-all:
        patterns:
          - "*"

  # The legacy app stays outdated on purpose: it's the modernization starting state.
  - package-ecosystem: "nuget"
    directory: "/app/ContosoUniversity"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
