name: Platform smoke test

# Logs in as the pipeline's managed identity (OIDC) and runs the permission probe.
# workflow_dispatch only works once this file is on the default branch, so pushes to ci-test/** also run it.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: Also run the permission probe
        type: boolean
        default: true
  push:
    branches: ['ci-test/**']

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-smoke
  cancel-in-progress: false

env:
  KIT_DIR: .

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: gh-lab
    steps:
      - uses: actions/checkout@v7

      - name: Start the session
        id: session
        uses: ./.github/actions/platform-session
        with:
          roster-json: ${{ secrets.ROSTER_JSON }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          shared-subscription-id: ${{ secrets.SHARED_SUBSCRIPTION_ID }}
          allowed-subscriptions: ${{ secrets.ALLOWED_SUBSCRIPTIONS }}
          denied-subscriptions: ${{ secrets.DENIED_SUBSCRIPTIONS }}
          mg-prefix: ${{ vars.MG_PREFIX }}
          denied-mg-prefixes: ${{ vars.DENIED_MG_PREFIXES }}
          kit-dir: ${{ env.KIT_DIR }}

      - name: Show who we are
        shell: bash
        run: |
          set -euo pipefail
          echo "Signed in as: $(az account show --query user.type --output tsv)"

      - name: Run the permission probe
        if: github.event_name == 'push' || inputs.probe
        shell: pwsh
        working-directory: ${{ env.KIT_DIR }}
        env:
          WORKLOAD: ${{ steps.session.outputs.workload-subscription-id }}
          DENIED: ${{ secrets.DENIED_SUBSCRIPTIONS }}
          PARENT_MG: ${{ vars.PARENT_MG }}
          MG_PREFIX: ${{ vars.MG_PREFIX }}
          LOCATION: ${{ vars.LOCATION }}
        run: |
          ./scripts/Test-PipelinePermissions.ps1 -WorkloadSubscriptionId $env:WORKLOAD `
            -ParentManagementGroupId $env:PARENT_MG -MgPrefix $env:MG_PREFIX -Location $env:LOCATION `
            -DeniedSubscriptionId ($env:DENIED -split ',')
          exit $LASTEXITCODE
