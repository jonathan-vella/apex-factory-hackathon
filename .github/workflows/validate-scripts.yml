name: Validate Scripts (PR)

# Runs the checks AGENTS.md asks for on every change to scripts, tests, infra and workflows: PSScriptAnalyzer, the
# Azure-free PowerShell tests, actionlint and Bicep lint. None of them touches Azure.
on:
  pull_request:
    paths:
      - "scripts/**"
      - "test/**"
      - "infra/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "PSScriptAnalyzerSettings.psd1"

permissions:
  contents: read

jobs:
  powershell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = @(foreach ($path in 'scripts', 'test', 'infra', '.github') {
              Invoke-ScriptAnalyzer -Path $path -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          })
          $results | ForEach-Object { Write-Host "$($_.ScriptName):$($_.Line) $($_.RuleName) $($_.Message)" }
          if ($results.Count -gt 0) { throw "PSScriptAnalyzer reported $($results.Count) finding(s)." }

      - name: Azure-free tests
        shell: pwsh
        run: |
          $failed = @()
          foreach ($test in Get-ChildItem ./test -Filter '*.Tests.ps1') {
              Write-Host "::group::$($test.Name)"
              & pwsh -NoProfile -File $test.FullName
              if ($LASTEXITCODE -ne 0) { $failed += $test.Name }
              Write-Host '::endgroup::'
          }
          if ($failed) { throw "Failed: $($failed -join ', ')" }

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: actionlint
        shell: bash
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  bicep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Bicep lint
        shell: bash
        run: |
          az bicep install
          status=0
          while IFS= read -r file; do
            echo "::group::$file"
            az bicep lint --file "$file" || status=1
            echo "::endgroup::"
          done < <(git ls-files 'infra/*.bicep')
          exit $status
