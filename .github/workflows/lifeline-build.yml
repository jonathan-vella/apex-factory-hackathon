name: Build lifelines

on:
  push:
    branches:
      - "lifeline/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_NOLOGO: true

permissions:
  contents: read

concurrency:
  group: lifeline-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ github.ref_name }}
    if: github.repository == 'jonathan-vella/apex-factory-hackathon' && startsWith(github.ref_name, 'lifeline/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.401"

      - name: Build
        run: dotnet build app/ContosoUniversity/ContosoUniversity.csproj -c Release
