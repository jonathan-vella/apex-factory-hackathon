<marker id="m-net" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0078D4"/></marker><marker id="m-id" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7B3FA0"/></marker><marker id="m-dns" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#008272"/></marker><marker id="m-tel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6B7B"/></marker><marker id="m-mig" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D18B00"/></marker><marker id="m-off" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A98A8"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/><text x="960" y="56" font-size="40" font-weight="700" fill="#0B1F3A" text-anchor="middle">GitHub Actions deploys it; people do the few steps it can't</text><rect x="330" y="92" width="300" height="52" rx="8" fill="#EEF2F6" stroke="#5B6B7B" stroke-width="1.5" /><text x="346" y="126" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="start">T-14</text><text x="416" y="126" font-size="18" font-weight="400" fill="#3A4A5A" text-anchor="start">Roster and preflight</text>
<rect x="642" y="92" width="300" height="52" rx="8" fill="#EEF2F6" stroke="#5B6B7B" stroke-width="1.5" /><text x="658" y="126" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="start">T-7</text><text x="728" y="126" font-size="18" font-weight="400" fill="#3A4A5A" text-anchor="start">Foundation</text>
<rect x="954" y="92" width="300" height="52" rx="8" fill="#EEF2F6" stroke="#5B6B7B" stroke-width="1.5" /><text x="970" y="126" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="start">T-3</text><text x="1040" y="126" font-size="18" font-weight="400" fill="#3A4A5A" text-anchor="start">Datacenters</text>
<rect x="1266" y="92" width="300" height="52" rx="8" fill="#EEF2F6" stroke="#5B6B7B" stroke-width="1.5" /><text x="1282" y="126" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="start">T-1</text><text x="1352" y="126" font-size="18" font-weight="400" fill="#3A4A5A" text-anchor="start">Vending</text>
<rect x="1578" y="92" width="300" height="52" rx="8" fill="#EEF2F6" stroke="#5B6B7B" stroke-width="1.5" /><text x="1594" y="126" font-size="26" font-weight="700" fill="#0B1F3A" text-anchor="start">T+2</text><text x="1664" y="126" font-size="18" font-weight="400" fill="#3A4A5A" text-anchor="start">Teardown</text>
<rect x="30" y="160" width="1860" height="230" rx="10" fill="#E6F1FB" stroke="#0078D4" stroke-width="1.8" /><text x="50" y="194" font-size="16" font-weight="700" fill="#0078D4" text-anchor="start">TEAM LEAD</text>
<rect x="30" y="400" width="1860" height="230" rx="10" fill="#E3F4F1" stroke="#008272" stroke-width="1.8" /><text x="50" y="434" font-size="16" font-weight="700" fill="#008272" text-anchor="start">EACH MEMBER</text>
<rect x="30" y="640" width="1860" height="230" rx="10" fill="#FFF6DD" stroke="#D18B00" stroke-width="1.8" /><text x="50" y="674" font-size="16" font-weight="700" fill="#D18B00" text-anchor="start">A PERSON DOES THIS</text>
<text x="50" y="236" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">A colleague your team</text><text x="50" y="258" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">nominates.</text>
<text x="50" y="476" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">Everyone, the team lead</text><text x="50" y="498" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">included.</text>
<rect x="650" y="205" width="284" height="150" rx="10" fill="#FFFFFF" stroke="#0078D4" stroke-width="2.5" /><use href="#ic-gh" x="662" y="217" width="36" height="36"/><rect x="708" y="219" width="212" height="32" rx="16" fill="#0078D4" stroke="#0078D4" stroke-width="1" /><text x="814.0" y="241" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">whatif, foundation</text><text x="664" y="283" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">Builds the shared hub</text><text x="664" y="307" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">Management groups, firewall,</text><text x="664" y="329" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">policies. About 15 to 25 minutes.</text>
<rect x="1274" y="205" width="284" height="150" rx="10" fill="#FFFFFF" stroke="#0078D4" stroke-width="2.5" /><use href="#ic-gh" x="1286" y="217" width="36" height="36"/><rect x="1332" y="219" width="212" height="32" rx="16" fill="#0078D4" stroke="#0078D4" stroke-width="1" /><text x="1438.0" y="241" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">vending</text><text x="1288" y="283" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">Connects every member</text><text x="1288" y="307" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">Restarts VMs, runs checks.</text><text x="1288" y="329" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">About 1 hour for 3 members.</text>
<rect x="1586" y="205" width="284" height="150" rx="10" fill="#FFFFFF" stroke="#0078D4" stroke-width="2.5" /><use href="#ic-gh" x="1598" y="217" width="36" height="36"/><rect x="1644" y="219" width="212" height="32" rx="16" fill="#0078D4" stroke="#0078D4" stroke-width="1" /><text x="1750.0" y="241" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">teardown</text><text x="1600" y="283" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">Removes every member,</text><text x="1600" y="307" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">then the foundation.</text>
<rect x="338" y="445" width="284" height="150" rx="10" fill="#FFFFFF" stroke="#0078D4" stroke-width="2.5" /><use href="#ic-gh" x="350" y="457" width="36" height="36"/><rect x="396" y="459" width="212" height="32" rx="16" fill="#0078D4" stroke="#0078D4" stroke-width="1" /><text x="502.0" y="481" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">whatif</text><text x="352" y="523" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">Preflight</text><text x="352" y="547" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">Checks your subscription and</text><text x="352" y="569" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">registers what it needs.</text>
<rect x="962" y="445" width="284" height="150" rx="10" fill="#FFFFFF" stroke="#0078D4" stroke-width="2.5" /><use href="#ic-gh" x="974" y="457" width="36" height="36"/><rect x="1020" y="459" width="212" height="32" rx="16" fill="#0078D4" stroke="#0078D4" stroke-width="1" /><text x="1126.0" y="481" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">member</text><text x="976" y="523" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">Deploys your datacenter,</text><text x="976" y="547" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">tests it, connects it to Arc.</text><text x="976" y="569" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">About 45 minutes.</text>
<rect x="1586" y="445" width="284" height="150" rx="10" fill="#FFFFFF" stroke="#0078D4" stroke-width="2.5" /><use href="#ic-gh" x="1598" y="457" width="36" height="36"/><rect x="1644" y="459" width="212" height="32" rx="16" fill="#0078D4" stroke="#0078D4" stroke-width="1" /><text x="1750.0" y="481" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">teardown</text><text x="1600" y="523" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">Removes your datacenter</text><text x="1600" y="547" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">and your spoke.</text>
<rect x="338" y="685" width="284" height="150" rx="10" fill="#FFFFFF" stroke="#F2A900" stroke-width="2.5" /><use href="#ic-user" x="350" y="697" width="34" height="34"/><text x="396" y="721" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">Share your values</text><text x="352" y="767" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">Send the team lead your</text><text x="352" y="791" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">subscription ID, index,</text><text x="352" y="815" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">object ID and email.</text>
<rect x="650" y="685" width="284" height="150" rx="10" fill="#FFFFFF" stroke="#F2A900" stroke-width="2.5" /><use href="#ic-user" x="662" y="697" width="34" height="34"/><text x="708" y="721" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">Graph grant</text><text x="664" y="767" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">A Privileged Role Administrator</text><text x="664" y="791" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">approves it once per team.</text>
<rect x="962" y="685" width="284" height="150" rx="10" fill="#FFFFFF" stroke="#F2A900" stroke-width="2.5" /><use href="#ic-user" x="974" y="697" width="34" height="34"/><text x="1020" y="721" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">Finish and check</text><text x="976" y="767" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">Arc assessment, vm-dev01</text><text x="976" y="791" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">setup, then a coach's</text><text x="976" y="815" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">readiness check.</text>
<rect x="1586" y="685" width="284" height="150" rx="10" fill="#FFFFFF" stroke="#F2A900" stroke-width="2.5" /><use href="#ic-user" x="1598" y="697" width="34" height="34"/><text x="1644" y="721" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">Remove the identity</text><text x="1600" y="767" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">An admin runs</text><text x="1600" y="791" font-size="15" font-weight="400" fill="#3A4A5A" text-anchor="start">Remove-PlatformPipeline.ps1.</text>
<path d="M1246 760H1416.0V355" stroke="#0078D4" stroke-width="3" fill="none"  marker-end="url(#m-net)"/>
<rect x="1316.0" y="525" width="200" height="40" rx="6" fill="#E6F1FB" stroke="#0078D4" stroke-width="1.5" /><text x="1416.0" y="542" font-size="14" font-weight="700" fill="#0B1F3A" text-anchor="middle">Coach approves,</text><text x="1416.0" y="560" font-size="14" font-weight="700" fill="#0B1F3A" text-anchor="middle">then vending</text>
<rect x="30" y="892" width="1860" height="138" rx="10" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2" />
<use href="#ic-gh" x="60" y="918" width="44" height="44"/>
<text x="120" y="946" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">One workflow</text><text x="120" y="976" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">platform.yml runs in your own repo.</text><text x="120" y="1000" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">Pick a stage; walk away.</text>
<use href="#ic-mi" x="670" y="918" width="44" height="44"/>
<text x="730" y="946" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">No passwords or keys</text><text x="730" y="976" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">A short-lived sign-in token, scoped to</text><text x="730" y="1000" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">one repo and one environment.</text>
<use href="#ic-user" x="1280" y="918" width="44" height="44"/>
<text x="1340" y="946" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">A guard checks first</text><text x="1340" y="976" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">Only the subscriptions on your team's</text><text x="1340" y="1000" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">list can be touched.</text><text x="960" y="1058" font-size="18" font-weight="400" fill="#4A5A6A" text-anchor="middle">Partner Modernization Factory | Non-production lab</text></svg>