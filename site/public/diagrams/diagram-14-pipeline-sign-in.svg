<symbol id="ic-user" viewBox="0 0 18 18"><defs><linearGradient id="user-be92901b-ec33-4c65-adf1-9b0eed06d677" x1="9" y1="6.88" x2="9" y2="20.45" gradientUnits="userSpaceOnUse"><stop offset="0.22" stop-color="#32d4f5" /><stop offset="1" stop-color="#198ab3" /></linearGradient><linearGradient id="user-b46fc246-25d8-4398-8779-1042e8cacae7" x1="8.61" y1="-0.4" x2="9.6" y2="11.92" gradientUnits="userSpaceOnUse"><stop offset="0.22" stop-color="#32d4f5" /><stop offset="1" stop-color="#198ab3" /></linearGradient></defs><title>Icon-identity-230</title><path d="M15.72,18a1.45,1.45,0,0,0,1.45-1.45.47.47,0,0,0,0-.17C16.59,11.81,14,8.09,9,8.09S1.34,11.24.83,16.39A1.46,1.46,0,0,0,2.14,18H15.72Z" fill="url(#user-be92901b-ec33-4c65-adf1-9b0eed06d677)" /><path d="M9,9.17a4.59,4.59,0,0,1-2.48-.73L9,14.86l2.44-6.38A4.53,4.53,0,0,1,9,9.17Z" fill="#fff" opacity="0.8" /><circle cx="9.01" cy="4.58" r="4.58" fill="url(#user-b46fc246-25d8-4398-8779-1042e8cacae7)" /></symbol>
<marker id="m-net" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0078D4"/></marker><marker id="m-id" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7B3FA0"/></marker><marker id="m-dns" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#008272"/></marker><marker id="m-tel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6B7B"/></marker><marker id="m-mig" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D18B00"/></marker><marker id="m-off" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A98A8"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/><text x="960" y="56" font-size="40" font-weight="700" fill="#0B1F3A" text-anchor="middle">How the pipeline signs in without a password</text><rect x="40" y="110" width="300" height="220" rx="10" fill="#FFFFFF" stroke="#0078D4" stroke-width="2.5" /><use href="#ic-gh" x="54" y="126" width="44" height="44"/><text x="110" y="158" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">Run a stage</text>
<circle cx="316" cy="136" r="13" fill="#0078D4"/><text x="316" y="142" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="56" y="206" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">In your own repo:</text>
<text x="56" y="232" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">gh workflow run</text>
<text x="56" y="258" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">platform.yml</text>
<path d="M340 220H425" stroke="#0078D4" stroke-width="3" fill="none"  marker-end="url(#m-net)"/>
<rect x="425" y="110" width="300" height="220" rx="10" fill="#FFFFFF" stroke="#0078D4" stroke-width="2.5" /><use href="#ic-gh" x="439" y="126" width="44" height="44"/><text x="495" y="158" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">Environment gh-lab</text>
<circle cx="701" cy="136" r="13" fill="#0078D4"/><text x="701" y="142" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="441" y="206" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">Only the branches you list.</text>
<text x="441" y="232" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">A reviewer, where your</text>
<text x="441" y="258" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">plan allows it.</text>
<path d="M725 220H810" stroke="#0078D4" stroke-width="3" fill="none"  marker-end="url(#m-net)"/>
<rect x="810" y="110" width="300" height="220" rx="10" fill="#FFFFFF" stroke="#0078D4" stroke-width="2.5" /><use href="#ic-user" x="824" y="126" width="44" height="44"/><text x="880" y="158" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">Guard</text>
<circle cx="1086" cy="136" r="13" fill="#0078D4"/><text x="1086" y="142" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="826" y="206" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">Checks the subscription</text>
<text x="826" y="232" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">and prefix against your</text>
<text x="826" y="258" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">team's list. Stops if</text>
<text x="826" y="284" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">it isn't on it.</text>
<path d="M1110 220H1195" stroke="#0078D4" stroke-width="3" fill="none"  marker-end="url(#m-net)"/>
<rect x="1195" y="110" width="300" height="220" rx="10" fill="#FFFFFF" stroke="#0078D4" stroke-width="2.5" /><use href="#ic-mi" x="1209" y="126" width="44" height="44"/><text x="1265" y="158" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">Microsoft Entra</text>
<circle cx="1471" cy="136" r="13" fill="#0078D4"/><text x="1471" y="142" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="1211" y="206" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">A short-lived GitHub token</text>
<text x="1211" y="232" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">proves which repo and</text>
<text x="1211" y="258" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">environment is asking.</text>
<path d="M1495 220H1580" stroke="#0078D4" stroke-width="3" fill="none"  marker-end="url(#m-net)"/>
<rect x="1580" y="110" width="300" height="220" rx="10" fill="#FFFFFF" stroke="#0078D4" stroke-width="2.5" /><use href="#ic-sub" x="1594" y="126" width="44" height="44"/><text x="1650" y="158" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">Azure</text>
<circle cx="1856" cy="136" r="13" fill="#0078D4"/><text x="1856" y="142" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="1596" y="206" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">The managed identity runs</text>
<text x="1596" y="232" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">the kit's scripts. There</text>
<text x="1596" y="258" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">is no stored secret.</text>
<rect x="40" y="370" width="900" height="420" rx="10" fill="#E3F4F1" stroke="#008272" stroke-width="2.5" /><text x="62" y="412" font-size="26" font-weight="700" fill="#008272" text-anchor="start">Member profile</text><text x="62" y="455" font-size="15" font-weight="700" fill="#008272" text-anchor="start">LIVES IN</text><text x="62" y="481" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">Your own repo</text><text x="62" y="505" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">One profile per repo</text><text x="62" y="545" font-size="15" font-weight="700" fill="#008272" text-anchor="start">IDENTITY</text><text x="62" y="571" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">id-factory-pipeline in rg-cicd</text><text x="62" y="595" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">In your own workload subscription</text><text x="62" y="635" font-size="15" font-weight="700" fill="#008272" text-anchor="start">OWNER ON</text><text x="62" y="661" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">Your workload subscription only</text><text x="62" y="685" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">No management group, no other subscription</text><text x="62" y="725" font-size="15" font-weight="700" fill="#008272" text-anchor="start">RUNS</text><text x="62" y="751" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">whatif, member, teardown</text><text x="62" y="775" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">Preflight, datacenter, test, Arc</text>
<rect x="980" y="370" width="900" height="420" rx="10" fill="#E6F1FB" stroke="#0078D4" stroke-width="2.5" /><text x="1002" y="412" font-size="26" font-weight="700" fill="#0078D4" text-anchor="start">Team lead profile</text><text x="1002" y="455" font-size="15" font-weight="700" fill="#0078D4" text-anchor="start">LIVES IN</text><text x="1002" y="481" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">The team lead's repo</text><text x="1002" y="505" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">With the roster as an environment secret</text><text x="1002" y="545" font-size="15" font-weight="700" fill="#0078D4" text-anchor="start">IDENTITY</text><text x="1002" y="571" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">id-factory-pipeline in rg-cicd</text><text x="1002" y="595" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">In the shared services subscription</text><text x="1002" y="635" font-size="15" font-weight="700" fill="#0078D4" text-anchor="start">OWNER AT</text><text x="1002" y="661" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">Tenant Root</text><text x="1002" y="685" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">Needed to create management groups and move subscriptions</text><text x="1002" y="725" font-size="15" font-weight="700" fill="#0078D4" text-anchor="start">RUNS</text><text x="1002" y="751" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">whatif, foundation, member, vending, teardown</text><text x="1002" y="775" font-size="16" font-weight="400" fill="#3A4A5A" text-anchor="start">For every member on the roster</text>
<rect x="40" y="820" width="1840" height="200" rx="10" fill="#FFF6DD" stroke="#F2A900" stroke-width="2" />
<text x="64" y="862" font-size="20" font-weight="700" fill="#D18B00" text-anchor="start">Why Owner?</text>
<text x="64" y="894" font-size="16" font-weight="400" fill="#0B1F3A" text-anchor="start">The kit assigns roles and policies, which Contributor can't do.</text>
<text x="64" y="918" font-size="16" font-weight="400" fill="#0B1F3A" text-anchor="start">Anyone who can run a workflow in the environment can use the</text>
<text x="64" y="942" font-size="16" font-weight="400" fill="#0B1F3A" text-anchor="start">identity, so use a non-production tenant only.</text>
<text x="664" y="862" font-size="20" font-weight="700" fill="#D18B00" text-anchor="start">What is protected</text>
<text x="664" y="894" font-size="16" font-weight="400" fill="#0B1F3A" text-anchor="start">Subscription IDs and the roster are environment secrets, never</text>
<text x="664" y="918" font-size="16" font-weight="400" fill="#0B1F3A" text-anchor="start">in the repo. Run logs show GUIDs as &lt;id:abcd&gt;.</text>
<text x="1264" y="862" font-size="20" font-weight="700" fill="#D18B00" text-anchor="start">Taking it down</text>
<text x="1264" y="894" font-size="16" font-weight="400" fill="#0B1F3A" text-anchor="start">The workflow can't remove its own identity. An admin runs</text>
<text x="1264" y="918" font-size="16" font-weight="400" fill="#0B1F3A" text-anchor="start">Remove-PlatformPipeline.ps1 after the teardown stage.</text><text x="960" y="1058" font-size="18" font-weight="400" fill="#4A5A6A" text-anchor="middle">Partner Modernization Factory | Non-production lab</text></svg>